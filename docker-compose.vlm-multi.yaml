# Example override: run an ADDITIONAL, unmanaged VLM on its own GPU.
#
# The base docker-compose.yaml runs the managed VLM engines (`vif-model-*`),
# one model serving at a time behind VIS's endpoint, on GPU 0 by default. This
# file adds `vlm-2`: a plain vLLM container serving one more model at the same
# time, on another card. VIS does not manage it -- streams reach it directly,
# as a bring-your-own endpoint, at `endpoint_url: http://vlm-2.docker:8000/v1`.
# Copy the `vlm-2` block for a third, etc. Run it with both files (this brings
# up the managed engines AND vlm-2, since vlm-2 also has the `vlm` profile):
#
#   docker compose -f docker-compose.yaml -f docker-compose.vlm-multi.yaml \
#     --profile default --profile vlm up -d
#
# vlm-2's model is a per-model env file in ./vlm-env/, picked by VLM_2_CONF
# (default nemotron); its GPU by VLM_2_GPU_IDS (default 1). e.g.:
#
#   VLM_2_CONF=nemotron docker compose \
#     -f docker-compose.yaml -f docker-compose.vlm-multi.yaml \
#     --profile default --profile vlm up -d
#
# Keep vlm-2 off the managed engines' card: VIS sizes them against the whole
# card and does not know about vlm-2, so sharing it can leave them short of
# memory.
services:
    vlm-2:
        hostname: vlm-2.docker
        image: vllm/vllm-openai:v0.26.0
        # `vlm` profile too, so `--profile vlm` brings up both containers.
        profiles: ["vlm", "vlm-2"]
        restart: unless-stopped
        # As the managed engines: time for vLLM to shut down cleanly.
        stop_grace_period: 30s
        env_file:
          - ./vlm-env/${VLM_2_CONF:-nemotron}.env
        volumes:
          - ./vlm-entrypoint.sh:/vlm-entrypoint.sh:ro
        # The launcher itself; vlm-entrypoint.sh is a shim that execs it.
          - ./vif-vlm-launcher.py:/vif-vlm-launcher.py:ro
          - ./vis/vlm-models:/root/.cache/huggingface
          - ./vis/vlm-cache:/root/.cache/vllm
        entrypoint: ["/bin/bash", "/vlm-entrypoint.sh"]
        environment:
          - VLM_GPU_IDS=${VLM_2_GPU_IDS:-1}   # its own card (vlm defaults to GPU 0)
          - VLLM_API_KEY=${VLLM_API_KEY:-}
          - HF_TOKEN=${HF_TOKEN:-}
          - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
        ipc: host
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # Publish only to reach it from another host; the host port must differ
        # from vlm's (e.g. "8001:8000").
        # ports:
        #   - "8001:8000"
        healthcheck:
          test: ["CMD-SHELL", "curl -fsS http://localhost:$${VLM_PORT:-8000}/health"]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 1800s
        deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  capabilities: [gpu, compute, utility]
                  count: all
