<!-- On-Demand (VOD) analysis fragment. To remove the feature entirely: delete this
     file, css/vod.css and js/vod/, then drop the two On-Demand entries from
     js/vif-nav.js, the count script in shm.html and the btn-vod-analysis id from
     setConfigButtonsEnabled in js/vif-dashboard.js. -->
<link rel="stylesheet" href="wse-plugins/server/vif/css/vif.css?v=1.2.1">
<link rel="stylesheet" href="wse-plugins/server/vif/css/vod.css?v=1.2.1">

<div class="vif-plugin vif-shell">
<nav id="vif-sidenav" class="vif-sidenav" aria-label="VIF pages"></nav>
<div class="content-wrapper vif-plugin vif-vod vif-main" id="vod-root">
    <!-- The menu's On-Demand and On-Demand Configs entries both live in this
         fragment: vod-main.js lights the right one on every V.nav(). -->

    <div id="vod-view"></div>
    <div id="vod-toasts"></div>
    <div id="vod-modal-root"></div>
</div>
</div>

<script src="wse-plugins/server/vif/vendor/hls.min.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-core.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-nav.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-api.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-sdk.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-field-registry.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-chain-editor.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-chain-presets.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-chain-builder.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vif-chain-results.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-util.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-main.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-jobs.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-new-analysis.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-chain.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-report.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-verify-report.js?v=1.2.1"></script>
<script src="wse-plugins/server/vif/js/vod/vod-settings.js?v=1.2.1"></script>
<script>
    VIF.nav.mount(document.getElementById('vif-sidenav'), {
        active: 'ondemand',
        // Both On-Demand entries are views of this fragment: switch in place.
        onSelect: function (item) {
            if (item.page !== 'vod.html') return false;
            VIF.vod.nav(item.view === 'settings' ? 'settings' : 'jobs');
            return true;
        }
    });
    VIF.vod.init();

    // Click-popover info tips (the circled-? pattern shared with shm.html):
    // upgrades every .vif-help-tip this fragment renders, including the ones
    // the report page re-renders on its poll.
    VIF.core.initClickTips(document.getElementById('vod-root'));

    // Deep link from another page's menu (On-Demand Configs): the fragment
    // always initializes to the jobs view, so the requested sub-view rides
    // over in sessionStorage.
    (function () {
        // Record this page as the last-used tab: a fresh entry into the
        // plugin (shm.html's sticky-tab script) returns here.
        try { sessionStorage.setItem('vifLastTab', 'ondemand'); } catch (e) { /* non-sticky */ }
        var pendingView = null;
        try {
            pendingView = sessionStorage.getItem('vifVodView');
            sessionStorage.removeItem('vifVodView');
        } catch (e) { /* storage unavailable — land on jobs as usual */ }
        if (pendingView === 'settings' && VIF.vod && VIF.vod.nav) VIF.vod.nav('settings');
    })();

    VIF.core.armTabCounts();
</script>
