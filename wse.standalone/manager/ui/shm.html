<link rel="stylesheet" href="wse-plugins/server/vif/css/vif.css?v=0.17.0">
<style>

    .vif-dashboard .plugin-scroll {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        overflow-y: visible;
    }

    .vif-dashboard .content-wrapper,
    .vif-dashboard .host-container,
    .vif-dashboard .table-wrapper,
    .vif-dashboard #streams-table {
        box-sizing: border-box;
    }

    .vif-dashboard .sticky-page-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
    }
    /* Pin the "VIF Dashboard" page title to the same style as the other pages' h2
       (vif.css .vif-plugin h2 sets only these two), with enough specificity to beat any
       Manager-global h2 rule in the dashboard's injection context. Weight/family are left
       to inherit so they match the other pages. Child combinator so it doesn't touch the
       "Active Streams" h2 (which lives inside .streams-header-title). */
    .vif-dashboard .streams-header > h2 {
        font-size: 18px;
        margin: 0;
    }
    .vif-dashboard .streams-header {
        align-items: center;
        margin-bottom: 10px;
        min-width: 0;
    }

    .vif-dashboard .streams-header-title {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
    }

    /* Same muted treatment as .host-info-line (vif.css) so the header
       summary doesn't add another type style to the stats section. */
    .vif-dashboard #header-values {
        font-size: 0.85em;
        color: #666;
        min-width: 0;
        overflow-wrap: anywhere;
    }

    /* The help-tip that explains the header averages sits right after
       #header-values in the markup; when there are no active streams the div
       is emptied (textContent = "") and a lone "?" explaining invisible
       content would float next to "Active Streams: 0" - hide it whenever the
       values it explains aren't rendered. */
    .vif-dashboard #header-values:empty + .vif-help-tip {
        display: none;
    }

    .vif-dashboard .content-wrapper {
        min-width: 0;
        overflow-x: hidden;
    }

    .vif-dashboard .vif-row {
        display: flex;
        justify-content: flex-end;
    }

    /* --- Host Info Grid --- */
    .vif-dashboard .host-container {
        width: 100%;
        max-width: 100%;
        min-width: 0;
    }


    .vif-dashboard .metric-thumb-card {
        min-width: min(240px, 100%);
        flex: 1 1 240px;
        max-width: 100%;
        background: #fafafa;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #ccc;
        transition: all 0.3s ease;
    }

    /* --- Streams Table --- */
    .vif-dashboard .table-wrapper {
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        background: #fafafa;
        border-radius: 12px;
        border: 1px solid #ccc;
        width: 100%;
        max-width: 100%;
        min-width: 0;
    }

    .vif-dashboard #streams-table {
        width: 100%;
        min-width: 1200px;
        border-collapse: collapse;
        font-size: 0.95em;
        table-layout: auto;
    }

    /* Scoped to the streams table: the dashboard also renders small per-GPU
       .gpu-table tables (vif.css) that must not inherit this chrome. */
    .vif-dashboard #streams-table thead {
        background-color: #000;
    }

    .vif-dashboard #streams-table th,
    .vif-dashboard #streams-table td {
        padding: 12px 15px;
        border-bottom: 1px solid #ccc;
        vertical-align: middle;
    }

    .vif-dashboard #streams-table th {
        color: #fff;
        text-align: center;
        font-weight: normal;
        white-space: nowrap;
    }

    .vif-dashboard #streams-table th:nth-child(7),
    .vif-dashboard #streams-table td:nth-child(7) {
        min-width: 200px;
        white-space: nowrap;
    }

    .vif-dashboard .empty-streams-row td {
        text-align: center;
        color: #666;
        font-style: italic;
        padding: 18px 15px;
    }

    .vif-dashboard .align-left {
        text-align: left;
    }
    .vif-dashboard .align-right {
        text-align: right;
    }

    /* Button styling to match reference */
    .vif-dashboard button {
        padding: 0.4em 0.7em;
        font-family: monospace;
        font-size: 0.85em;
        cursor: pointer;
        background: #2a71ab;
        border: 1px solid #ccc;
        color: #ffffff;
        border-radius: 4px;
        margin-bottom: 4px;
    }

    .vif-dashboard button:hover {
        background: #225783;
    }

    .vif-dashboard button:disabled {
      background-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
      pointer-events: none;
    }

    .vif-dashboard .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 10px;
        max-width: 500px;
    }

    .vif-dashboard .vif-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 2px;
        min-width: 0;
    }

    /* Top bar (title + config buttons) sitting directly above the metric
       groups, no divider band - see the markup comment. Tighter than the old
       standalone .streams-header band it replaces. */
    .vif-dashboard .dashboard-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
    }

    /* Give the dashboard Inference-fps range slider a FIXED width for every
       detector type. The range input otherwise has no width rule, so inside
       the shared-width Stream Info column its default flex-shrink let the
       amount of sibling text on its line decide its rendered width - the scene
       row's long "= N frames / Ns request" note squeezed it narrow while the
       vlm row's short value left it wide. flex:0 0 <w> pins the basis and
       disables grow/shrink so every detector's slider matches. */
    .vif-dashboard .slider {
        width: 140px;
        flex: 0 0 140px;
    }

    .vif-dashboard .vif-skip-controls {
        flex-direction: column;
        align-items: flex-end;
        gap: 0;
    }

    /* Each line is its own right-aligned flex row; the 6px gap is the old
       breathing room between the label, slider, value (line 1) and between the
       note and its help-tip (line 2). */
    .vif-dashboard .vif-skip-line,
    .vif-dashboard .vif-skip-note-line {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
    }

    /* Line 2 collapses to zero height whenever the note span is empty (object/
       synthetic rows, and windowed streams with no duration): an empty span is
       a zero-height flex item, so those rows gain no blank line under the
       slider. The tip is removed by updateSkipFrameDisplay() when the note
       clears, so a lone "?" never sits on an otherwise-empty line 2. */

    /* Fixed geometry for the Inference-fps value so a 1- vs 2-digit value can't
       shift the slider horizontally - the whole point of the two-line split is
       that the sliders in different detector rows align in the same column. */
    .vif-dashboard .vif-skip-value {
        display: inline-block;
        min-width: 2ch;
        text-align: left;
    }

    /* The container - defines the size of the switch */
    .vif-dashboard .switch {
        display: flex;
    }

    /* Thumbnail image styling */
    .vif-dashboard #streams-table img {
        border-radius: 4px;
    }

    .vif-dashboard .stream-type-cell {
        min-width: 150px;
        text-align: center;
    }

    .vif-dashboard .stream-type-icon {
        width: 56px;
        max-width: 100%;
        height: auto;
        margin-bottom: 7px;
    }

    .vif-dashboard .stream-type-meta-line {
        text-align: center;
        line-height: 1.35;
    }

    .vif-dashboard .stream-type-meta-secondary {
        color: #555;
    }

    .vif-dashboard .thumbnail-card-image {
        display: block;
        width: 100%;
        max-width: 320px;
        height: auto;
    }

    .vif-dashboard .row-status-line {
        display: block;
        min-height: 1.35em;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    /* The reason line's own row is a single colspan=8 cell spanning the whole
       table. max-width:0 stops a long (server-provided) reason from widening
       the table under table-layout:auto - the data rows above fix the column
       widths and the reason div truncates within them. Replaces the legacy
       height=14 attribute: height is now the constant .row-status-line slot. */
    .vif-dashboard #streams-table td.row-status-cell {
        max-width: 0;
    }

    .vif-dashboard .frames-window-note {
        color: #555;
        white-space: nowrap;
    }

    @media (max-width: 1024px) {
        .vif-dashboard .content-wrapper {
            padding: 12px;
        }

        .vif-dashboard #streams-table th,
        .vif-dashboard #streams-table td {
            padding: 10px 12px;
        }
    }
</style>

<div class="vif-dashboard vif-plugin">
<div class="plugin-scroll">
    <div class="content-wrapper">

        <!-- Page header: same sticky-page-header / streams-header structure as
             stream-config.html / default.html / playback.html (title left, buttons right,
             divider below). The config buttons stand in for the other pages' Back button. -->
        <div class="sticky-page-header">
        <div class="streams-header">
            <h2>VIF Dashboard</h2>
            <div id="config-streams" class="item-right" style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
                <button id="btn-default-config" disabled title="Waiting for Engine connection" onclick="loadAjaxPluginContent('server','vif','default.html','')">Default Config</button>
                <button id="btn-stream-configs" disabled title="Waiting for Engine connection" onclick="loadAjaxPluginContent('server','vif','stream-config.html','')">Stream Configs</button>
            </div>
        </div>
        </div>

        <div id="dashboard-banner" class="dashboard-banner" style="display:none;"></div>

        <div class="metric-group" id="wse-host-group">
            <div class="metric-group-title">WSE Host</div>
            <div id="host-display" class="host-container metric-grid">
            </div>
            <div id="host-nvidia" class="host-info-line">
            </div>
            <div id="host-stats" class="host-container metric-grid">
            </div>
        </div>

        <div id="vis-instances-container"></div>

        <div class="streams-header">
            <div class="streams-header-title">
                <h2>Active Streams: <span id="active-streams">0</span></h2>
                <div id="header-values"></div>
                <span class="vif-help-tip" title="Processing avg = mean Video Intelligence Service (VIS) processing time across active streams. Detect avg = mean WSE object-processing (frame detect) time across active streams.">?</span>
            </div>
            <div class="vif-controls item-right">
                Thumbnails&nbsp;
                <label class="switch">
                    <input type="checkbox" id="thumbnailToggle">
                    <span class="slider-switch"></span>
                </label>
            </div>
        </div>

        <div id="thumbnail-wrapper">
            <div id="thumbnail-display" class="host-container"></div>
        </div>

        <div id="table-wrapper" class="table-wrapper">
            <table id="streams-table">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Stream Name</th>
                        <th>Stream Info</th>
                        <th>Ping (RTT)<span class="vif-help-tip" title="Round-trip time to the Video Intelligence Service (VIS)">?</span></th>
                        <th>Ttl Processing Avg<span class="vif-help-tip" title="Video Intelligence Service (VIS) processing time per analysis request">?</span></th>
                        <th>Frame Detect Avg<span class="vif-help-tip" title="WSE Object Processing Time">?</span></th>
                        <th>Frames Analyzed<span class="vif-help-tip" title="Frames analyzed by the Video Intelligence Service (VIS) out of the frames WSE captured from the stream, averaged over a period of time">?</span></th>
                        <th>Thumbnail</th>
                    </tr>
                </thead>
                <tbody id="streams-body">
                </tbody>
            </table>
        </div>

    </div>
</div>
</div>

<script src="wse-plugins/server/vif/js/vif-core.js?v=0.17.0"></script>
<script src="wse-plugins/server/vif/js/vif-dashboard.js?v=0.17.0"></script>
<script>
    VIF.dashboard.init();
</script>
