# TLS-terminating reverse proxy for the Video Intelligence Service (VIS).
#
# Processed as an nginx template: ${VIS_TLS_PORT} is substituted at container
# start from the environment (default 5443) via the stock nginx entrypoint.
#
# Enable it by merging the TLS overlay onto the main compose file with `-f`
# (there is no dedicated tls-proxy profile):
#
#   docker compose -f docker-compose.yaml -f docker-compose.tls-proxy.yaml \
#                  --profile vi-service up
#
# then drop your certificate/key in ./certs as server-cert.pem / server-key.pem.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Pass the WebSocket Upgrade handshake through unchanged.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS, so the VIS hostname resolves at request time and
    # this proxy starts even if VIS comes up a little later.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        # Plain HTTP/1.1 over TLS (no http2): the WebSocket Upgrade handshake
        # relies on HTTP/1.1 semantics.
        listen ${VIS_TLS_PORT} ssl;

        ssl_certificate     /certs/server-cert.pem;
        ssl_certificate_key /certs/server-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            # Variable + resolver => lazy DNS resolution (see resolver above).
            set $vis_upstream video-intelligence-service.docker:5001;
            proxy_pass http://$vis_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # VIS WebSocket sessions are long-lived; don't time them out.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
