# TLS-terminating reverse proxy for the Video Intelligence Service (VIS).
#
# Why this exists (Gate A2): VIS itself speaks plaintext and only on the
# internal Docker bridge. That is fine when Engine (VIC) and VIS share a host.
# But when VIS runs on a SEPARATE host, the Engine->VIS hop crosses the network
# and MUST be encrypted. This nginx proxy terminates TLS with a real CA cert
# you provide and forwards plaintext to VIS over the internal bridge, so Engine
# dials `wss://<this-host>:5443` with NO client-side truststore changes.
#
# Enable it by merging the TLS overlay onto the main compose file with `-f`
# (there is no dedicated tls-proxy profile):
#
#   docker compose -f docker-compose.yaml -f docker-compose.tls-proxy.yaml \
#                  --profile vi-service up
#
# then drop your certificate/key in ./certs as server-cert.pem / server-key.pem.
# This file is kept byte-identical in the framework and VIS repos; the compose
# overlay referenced above ships in the framework repo.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Pass the WebSocket Upgrade handshake through unchanged.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS, so the VIS hostname resolves at request time and
    # this proxy starts even if VIS comes up a little later.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        # Plain HTTP/1.1 over TLS (no http2): the WebSocket Upgrade handshake
        # relies on HTTP/1.1 semantics.
        listen 5443 ssl;

        ssl_certificate     /certs/server-cert.pem;
        ssl_certificate_key /certs/server-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            # Variable + resolver => lazy DNS resolution (see resolver above).
            set $vis_upstream video-intelligence-service.docker:5001;
            proxy_pass http://$vis_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # VIS WebSocket sessions are long-lived; don't time them out.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
