# Model overlay: run the VLM sidecar with NVIDIA Nemotron Nano 12B VL.
# Alternative to selecting the model with VLM_CONF -- both work; use whichever
# fits your tooling:
#
#   docker compose -f docker-compose.yaml -f docker-compose.vlm-nemotron.yaml \
#     --profile default --profile vlm up -d
#
# The model config still comes from ./vlm-env/nemotron.env. The !override tag
# REPLACES the base env_file list (instead of compose's default append-merge),
# so no keys from the base's default model file leak through; the overlay also
# takes precedence over VLM_CONF. Requires docker compose v2.24.4+.
services:
    vlm:
        env_file: !override
          - ./vlm-env/nemotron.env
