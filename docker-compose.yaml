# name: Wowza Streaming Engine Video Intelligence Framework

# ── Shared definition of a managed VLM engine ─────────────────────────────
# Every `vif-model-*` service below is this plus the model it serves. The
# engine runs the stock vLLM image through vif-vlm-launcher.py, which reads
# the command VIS resolved for it from the state volume and runs it. Sleep
# mode, dev mode and the hot/cold tier all come from that spec, not from here:
# a model that cannot sleep is never started with sleep mode.
x-vif-model-engine-env: &vif-model-engine-env
    # Where the launcher finds its spec (<dir>/engines/<engine key>.json) and
    # writes its readiness marker and log. Must be the same path VIS uses.
    VIF_STATE_DIR: /vif-state
    # Present while an engine brought back from parked starts: the healthcheck
    # below accepts it while nothing answers /health yet.
    VIF_STARTING_FILE: /tmp/vif-engine-starting
    # Guards the engine's control endpoints (/sleep, /wake_up, ...) with
    # VLLM_API_KEY. A no-op when no key is set.
    VIF_ENGINE_MIDDLEWARE: vif_auth.VifAuthMiddleware
    # Optional, never generated. When set, the engines require it and VIS
    # sends it; streams pass the same value as `api_key`. Left out of the
    # container entirely when unset.
    VLLM_API_KEY:
    # Read by HuggingFace directly: token for gated models and rate limits,
    # and offline mode for hosts with pre-seeded weights.
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-}
    # Kept from the single-sidecar layout: pins every engine to the given
    # card(s). Unset = GPU 0.
    VLM_GPU_IDS: ${VLM_GPU_IDS:-}

x-vif-model-engine: &vif-model-engine
    image: vllm/vllm-openai:v0.26.0
    profiles: ["vlm"]
    restart: unless-stopped
    # On SIGTERM the launcher passes the signal to vLLM, waits for it to exit
    # (10.7 s measured for the largest model, CUDA teardown included), then up
    # to 10 s for its output to drain. Docker's default 10 s would SIGKILL a
    # clean shutdown halfway; 30 s covers the 20.7 s with room to spare.
    stop_grace_period: 30s
    # VIS writes the specs, so it starts first. An engine that still finds no
    # spec waits for one, then exits with a configuration error and is
    # restarted.
    depends_on:
      video-intelligence-service-gpu:
        condition: service_healthy
    entrypoint: ["python3", "/vif-vlm-launcher.py"]
    volumes:
      - ./vif-vlm-launcher.py:/vif-vlm-launcher.py:ro
      # The control-endpoint guard, loaded through vLLM's --middleware flag.
      - ./vlm-patches/vif_auth.py:/usr/local/lib/python3.12/dist-packages/vif_auth.py:ro
      # Cosmos3-Edge fix for the v0.26.0 image (vLLM PR #49190 cherry-pick,
      # see the file's header); inert for other models. Remove on a fixed release.
      - ./vlm-patches/cosmos3_edge.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/cosmos3_edge.py:ro
      # Model weights, shared by every engine: each one downloads its own on
      # first load and reuses them after. For air-gapped hosts, pre-seed this
      # directory (see docs/VLM_GUIDE.md) and set HF_HUB_OFFLINE=1 in .env.
      - ./vis/vlm-models:/root/.cache/huggingface
      # vLLM's torch.compile artifacts, keyed per model; persisting them
      # skips the recompile whenever a container is recreated. Safe to
      # delete -- the next load just recompiles.
      - ./vis/vlm-cache:/root/.cache/vllm
      # Specs, readiness and awake markers, engine logs and the load lock
      # that serializes cold loads on the card. Shared with VIS.
      - ./vis/vlm-state:/vif-state
    ipc: host   # vLLM workers need large shared memory (esp. tensor parallel)
    # `vif-engines` is how VIS reaches the engine; nothing else is on it.
    # `vif-engines-egress` exists only for the first-boot weight download.
    networks:
      - vif-engines
      - vif-engines-egress
    # No `ports:`, on purpose: engines are reached only through VIS.
    healthcheck:
      # 200 while serving, while asleep, and while parked (the launcher
      # answers it itself), so a resting engine is never marked unhealthy. A
      # cold start from parked outlasts five failed checks while vLLM loads,
      # so the launcher's starting file stands in for /health until it answers.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || test -e \"$${VIF_STARTING_FILE}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Engines load one at a time, and the serving one loads last: it
      # waits up to 7800 s for the rest of the pool (four loads of up to
      # 1800 s each, plus their steps into sleep), then gives its own load
      # 1800 s, after up to 300 s waiting for VIS to write its spec. 9900 s,
      # rounded up. A healthy engine is marked healthy on its first passing
      # check, so this only delays reporting an engine that never comes up.
      start_period: 10200s
    deploy:
      resources:
        reservations:
          devices:
            # All GPUs are exposed; the engine uses GPU 0 unless the spec
            # (or VLM_GPU_IDS) pins another.
            - driver: nvidia
              capabilities: [gpu, compute, utility]
              count: all

services:
    wse:
        hostname: wse.docker
        image: wowza/wowza-streaming-engine:vif-1.1.0
        pull_policy: always
        #platform: linux/arm64
        profiles: ["", "wse", "wse-only", "default"]
        restart: unless-stopped # Automatically restarts unless manually stopped
        ##### comment deploy section below for non gpu support
        deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  capabilities: [video, gpu, compute, utility]
                  count: all
        environment:
            - WSE_LICENSE_KEY=${WSE_LICENSE_KEY}
            - ADMIN_USER=${WSE_ADMIN_USER}
            - ADMIN_PASSWORD=${WSE_ADMIN_PASSWORD}
            # Source IPs allowed to reach the WSE REST interface. Set IPWHITELIST
            # in .env to restrict access; default allows any IP.
            - IPWHITELIST=${IPWHITELIST:-*}
            - LOG_LEVEL=INFO #DEBUG INFO WARN ERROR
            - REST_API_DOCUMENTATION=disabled #enabled | disabled | remove to not change
            - VIS_API_KEY=${VIS_API_KEY}
            - VIS_LICENSE=${VIS_LICENSE}
            - VIS_PROTOCOL=${VIS_PROTOCOL}
            - VIS_HOST=${VIS_HOST}
            - VIS_PORT=${VIS_PORT:-5001}
        #to persist the configurations between starts of Wowza Streaming Engine, uncomment the lines below:
        volumes:
             - ./wse/conf:/usr/local/WowzaStreamingEngine/conf
             - ./wse/conf.modules:/usr/local/WowzaStreamingEngine/conf.modules
             - ./wse/content:/usr/local/WowzaStreamingEngine/content
             - ./wse/transcoder:/usr/local/WowzaStreamingEngine/transcoder
             - ./wse/logs:/usr/local/WowzaStreamingEngine/logs
             - ./wse/vif-vod-jobs:/usr/local/WowzaStreamingEngine/vif-vod-jobs   # VOD job records, results, thumbnails

        ports:
            - 80:80                     #HLS
            - 443:443                   #SSL
            - 554:554                   #RTSP
            - 1935:1935                 #RTMP
            - 8087:8087                 #REST API
            - 8089:8089                 #REST API Documenation
            - 6970-6999:6970-6999/udp   #WEBRTC
            - 10000:10000/udp           #SRT
        env_file:
            - .env
        extra_hosts:
            - "host.docker.internal:host-gateway"

    manager:
        hostname: wsem.docker
        image: wowza/wowza-streaming-engine-manager:vif-1.1.0
        pull_policy: always
        #platform: linux/arm64
        profiles: ["", "wse", "wsem", "default"]
        environment:
            - LOG_LEVEL=WARN #DEBUG INFO WARN ERROR
            - WSE_HOST=http://wse.docker:8087
            - REST_API_DOCUMENTATION=disabled #enabled | disabled | remove to not change <http://localhost:8088/RESTAPIDocumentation/>
            - ADMIN_USER=${WSE_ADMIN_USER}
            - ADMIN_PASSWORD=${WSE_ADMIN_PASSWORD}
            # - JKS_FILE=/usr/local/tomcat/conf/tls.jks
            # - JKS_PASSWORD=tbd
            # - WSE_PLAYBACK_HOST=tbd
            # - WSE_PLAYBACK_PORT=tbd
        ports:
            - 8088:8080
            - 8443:8443
        env_file:
            - .env
        extra_hosts:
          - "host.docker.internal:host-gateway"

    # One-shot init: hands the ./vis bind mounts to the non-root vis user
    # (uid/gid 1001) so VIS can write models, logs and the VLM state volume,
    # then exits (VIS waits via depends_on). Reuses the VIS image -- no extra
    # pull, no GPU needed.
    vis-init:
        image: wowza/wowza-video-intelligence-service:1.1.0-gpu
        pull_policy: always
        profiles: ["", "vi-service", "default", "vlm"]
        user: "0:0"
        restart: "no"
        entrypoint: ["chown", "-R", "1001:1001", "/build/models", "${LOG_DIR:-/logs}", "/vif-state"]
        volumes:
          - ./vis/models:/build/models
          - ./vis/logs:${LOG_DIR:-/logs}
          - ./vis/vlm-state:/vif-state

    video-intelligence-service-gpu:
        hostname: video-intelligence-service.docker
        image: wowza/wowza-video-intelligence-service:1.1.0-gpu
        pull_policy: always
        #platform: linux/arm64
        # `vlm` too: the managed engines are nothing without VIS, which writes
        # their specs and is the only way to reach them.
        profiles: ["", "vi-service", "default", "vlm"]
        restart: unless-stopped
        depends_on:
          vis-init:
            condition: service_completed_successfully
        environment:
        # Core service configuration
          - VIS_PORT=${VIS_PORT:-5001}
          - LOG_LEVEL=INFO
          - ENABLE_NETWORK_METRICS_LOGGING=false  # Set to 'true' to enable periodic network logging
          - VIDEO_FRAME_REQUEST_TIMEOUT_SECONDS=2.0  # Timeout (seconds) for waiting on video frame responses
        # Optional: Inference thread pool tuning (default: 32 threads per GPU)
        # - INFERENCE_THREADS_PER_GPU=32
        # Optional: Enable API key authentication
          - VIS_API_KEY=${VIS_API_KEY}
        # Refuse to start without a non-empty VIS_API_KEY (fail closed). Set
        # SECURE_MODE=false in .env only for air-gapped/internal-only
        # deployments that consciously opt out of authentication.
          - SECURE_MODE=${SECURE_MODE:-true}
        # TensorRT: Specify which models to precompile (optional, defaults to scanning models/ folder)
        # - TRT_MODELS=object-detection-medium
        # - TRT_MODELS=object-detection-nano,my-custom-model.pth
        # License key string required to run VIS
          - VIS_LICENSE=${VIS_LICENSE}
        # Optional: Enable SSL/TLS for HTTPS and WSS
        # - SSL_KEYFILE=/certs/server-key.pem
        # - SSL_CERTFILE=/certs/server-cert.pem
        # - SSL_KEYFILE_PASSWORD=optional-key-password
        # Managed VLM engines. VIF_STATE_DIR is the state volume mounted
        # below; VIS writes each engine's spec there. The rest are optional
        # and passed only when set:
        #   VLLM_API_KEY         the engines' key, sent on VIS's calls to them
        #   VLM_CONF             the model the pre-upgrade sidecar served
        #                        (a vlm-env/ name); seeds the active model on
        #                        the first start after an upgrade
        #   VLM_FORCE_ALL_COLD   true on hosts where sleep mode cannot run
        #                        (e.g. WSL2): every engine rests parked
        #   VLM_RAM_RESERVE_MIB  host RAM kept back from sleeping engines
          - VIF_STATE_DIR=/vif-state
          - VLLM_API_KEY
          - VLM_CONF
          - VLM_FORCE_ALL_COLD
          - VLM_RAM_RESERVE_MIB
        # NVIDIA GPU configuration
          - NVIDIA_VISIBLE_DEVICES=all  # Or specify GPU IDs: '0,1'
          - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        # Optional: container path where log files are written. Set LOG_DIR
        # in .env to override (default /logs); the ./vis/logs bind mount
        # below follows it.
          - LOG_PATH=${LOG_DIR:-/logs}
        # The bind mounts below keep HOST ownership, but the `vis-init` service
        # above chowns them to 1001 before this service starts, so no host-side
        # action is needed. (LOG_PATH=/logs lives outside /build; vis-init covers
        # it too.)
        volumes:
        # Mount models directory for checkpoints and the TensorRT engine cache
        # (models/engines). Writable by default so VIS can download weights and
        # build engines on first boot.
        #
        # Hardening (optional): mount read-only to block planting a malicious
        # .pth that the startup model scan would deserialize. Only for stacks
        # that pre-seed all weights AND pre-build the TRT engines and use no
        # custom models -- read-only, VIS cannot download weights, build/refresh
        # engines, or write the cache at runtime. Swap the line below for:
        #   - ./vis/models:/build/models:ro
          - ./vis/models:/build/models
        # Optional: Mount SSL certificates for HTTPS/WSS
        # - ./certs:/certs:ro
        # Optional: Mount for RT-DETR v2 model cache (for offline usage).
        # HOME=/build for the vis user, so HF caches under /build/.cache.
        # - ~/.cache/huggingface:/build/.cache/huggingface:ro
        # Mount log directory (target follows LOG_DIR from .env)
          - ./vis/logs:${LOG_DIR:-/logs}
        # The managed VLM engines' state volume, shared with every
        # vif-model-* service (the vis-init service above makes it writable).
          - ./vis/vlm-state:/vif-state
        # The engines' weights, read-only: VIS reads a LoRA adapter's config
        # and tensor names here before any engine loads it (VIF_WEIGHTS_DIR).
          - ./vis/vlm-models:/vif-weights:ro
        # The service is only reachable on the internal compose network by
        # default. Engine reaches it by hostname
        # (VIS_HOST=video-intelligence-service.docker) on the bridge, so the
        # same-host stack works without publishing the port. To reach VIS from
        # other machines (e.g. Engine running on a different host), publish the
        # port by uncommenting below -- and set a non-empty VIS_API_KEY in .env
        # (keep SECURE_MODE=true) so the endpoint requires authentication:
        # The same port carries the managed VLM endpoint (/v1), which does
        # not take VIS_API_KEY: when publishing it, also set VLLM_API_KEY so
        # /v1 requires a key. Engine ports are never published.
        # ports:
        #   - "${VIS_PORT:-5001}:${VIS_PORT:-5001}"
        env_file:
            - .env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # The default network is where Engine reaches VIS; vif-engines is
        # where VIS reaches the managed VLM engines.
        networks:
            - default
            - vif-engines
        healthcheck:
          test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', int('${VIS_PORT:-5001}')), timeout=5).close()"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 10s
        runtime: nvidia

    # ── Managed VLM engines (opt-in, `--profile vlm`) ──────────────────────
    # One container per model in the Video Intelligence Service's catalog.
    # Every one of them is resident, but only one serves at a time: VIS decides
    # which, and the others rest asleep (weights in host RAM, back in a second
    # or two) or parked (no engine process, weights on disk, back in a cold
    # start). Switching models is a call to VIS -- no container is recreated.
    #
    #   docker compose --profile default --profile vlm up -d
    #
    # Streams point at VIS's own endpoint,
    # `endpoint_url: http://video-intelligence-service.docker:5001/v1`, and
    # name the model in `model_name`. The address the single sidecar used to
    # answer on (`http://vlm.docker:8000/v1`) is served the same way, so older
    # stream configs keep working without an edit. Full guide: docs/VLM_GUIDE.md.
    #
    # The service name is the engine's address: `vif-model-` plus the model id
    # lowercased, with every run of other characters turned into one `-`. VIS
    # finds each engine by that name. The engines sit on an internal network
    # that only VIS joins, and no engine port is ever published.
    vif-model-qwen-qwen3-vl-4b-instruct-fp8:
        <<: *vif-model-engine
        hostname: vif-model-qwen-qwen3-vl-4b-instruct-fp8
        environment:
            <<: *vif-model-engine-env
            VLM_MODEL: Qwen/Qwen3-VL-4B-Instruct-FP8

    vif-model-nvidia-nvidia-nemotron-nano-12b-v2-vl-fp8:
        <<: *vif-model-engine
        hostname: vif-model-nvidia-nvidia-nemotron-nano-12b-v2-vl-fp8
        environment:
            <<: *vif-model-engine-env
            VLM_MODEL: nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8

    vif-model-google-gemma-3-4b-it:
        <<: *vif-model-engine
        hostname: vif-model-google-gemma-3-4b-it
        environment:
            <<: *vif-model-engine-env
            VLM_MODEL: google/gemma-3-4b-it

    vif-model-nvidia-cosmos3-edge:
        <<: *vif-model-engine
        hostname: vif-model-nvidia-cosmos3-edge
        environment:
            <<: *vif-model-engine-env
            VLM_MODEL: nvidia/Cosmos3-Edge

    vif-model-nvidia-cosmos3-nano:
        <<: *vif-model-engine
        hostname: vif-model-nvidia-cosmos3-nano
        environment:
            <<: *vif-model-engine-env
            VLM_MODEL: nvidia/Cosmos3-Nano

    # ── Synthetic Video Detector NIM sidecar (opt-in) ──────────────────────
    # NVIDIA Synthetic Video Detector (SVD) NIM backing the
    # `detector_type=synthetic` analyzer. Bidirectional-streaming gRPC: VIS
    # relays each VIC-remuxed H.264 window (no re-encode) and returns a
    # per-window Real/Fake verdict.
    #
    # Opt-in via the `svd` compose profile -- a bare `docker compose up`
    # never starts it, and the profile gates ONLY the detector sidecar;
    # combine profiles to start it alongside the services it serves:
    #   docker compose --profile svd up                        # detector sidecar only
    #   docker compose --profile default --profile svd up      # full stack + svd
    #   docker compose --profile vi-service --profile svd up   # VIS + svd pairing
    # Teardown: a bare `docker compose down` leaves svd running; use
    # `docker compose --profile svd down` to stop it (the sidecar only).
    #
    # ACCESS-GATED IMAGE: nvcr.io/nim/nvidia/synthetic-video-detector is
    # distributed through NVIDIA NGC / NVIDIA AI Enterprise and requires the
    # VI-550 partnership entitlement. Before first run, authenticate to NGC
    # and set NGC_API_KEY in .env (the container also reads it to pull the
    # model profile on first boot):
    #   docker login nvcr.io   # username: $oauthtoken   password: <NGC_API_KEY>
    #
    # Streams opt in by setting `endpoint: "svd.docker:8001"` in their
    # synthetic config (the service also resolves as plain `svd`; transport
    # security auto-detects, so a non-443 in-network port stays plaintext —
    # no TLS setting needed). For a hosted / bring-your-own endpoint instead,
    # skip this profile and point `endpoint` at it (e.g.
    # grpc.nvcf.nvidia.com:443 with api_key + function_id).
    #
    # GPU REQUIREMENT: the NIM decodes on the GPU and needs NVDEC/NVENC +
    # Tensor cores -- T4 / A10 / A16 / A40 / L4 / L40 / RTX 4090 / 5090 /
    # RTX PRO 6000 Blackwell. NOT A100 / H100 / B100 (no NVENC/NVDEC).
    # Full deploy + air-gap guide: ./docs/SYNTHETIC_VIDEO_DETECTOR.md
    svd:
        hostname: svd.docker
        image: ${SVD_NIM_IMAGE:-nvcr.io/nim/nvidia/synthetic-video-detector:latest}
        profiles: ["svd"]
        # Wait for the one-shot that makes the model-cache volume writable by
        # the non-root NIM before booting -- see the svd-cache-init service.
        depends_on:
          svd-cache-init:
            condition: service_completed_successfully
        restart: unless-stopped
        shm_size: "8gb"   # NIM decode + inference need large shared memory
        environment:
          - NGC_API_KEY=${NGC_API_KEY:-}                       # NGC key; also pulls the model profile on first boot
          # Optional GPU-arch profile id; the NIM auto-selects when this is
          # UNSET. Passed as a bare key (NOT `=${...:-}`) on purpose: an
          # empty-but-set value suppresses auto-selection and the NIM fails to
          # start, whereas a bare key is omitted from the container entirely
          # when unset. To pin a profile, set NIM_MANIFEST_PROFILE=<id> in .env
          # (see docs/SYNTHETIC_VIDEO_DETECTOR.md).
          - NIM_MANIFEST_PROFILE
          # Server-side TLS on the NIM's ports -- for securing a PUBLISHED
          # endpoint (see the ports note below).
          # Set NIM_SSL_MODE=mtls (mutual TLS -- also authenticates clients;
          # plain tls encrypts only) plus the /certs paths in .env and
          # uncomment the ./certs mount below; full walkthrough in
          # docs/SYNTHETIC_VIDEO_DETECTOR.md (Deployment topologies).
          - NIM_SSL_MODE
          - NIM_SSL_CERT_PATH
          - NIM_SSL_KEY_PATH
          - NIM_SSL_CA_CERTS_PATH
          - NIM_CACHE_PATH=/opt/nim/.cache
        # Model-profile cache, kept in a named volume (not a ./vis bind mount)
        # so it's Docker-managed and survives `down` -- only `down -v` removes
        # it. A fresh volume is created root-owned, but the NIM runs as non-root
        # uid 1000, so the svd-cache-init one-shot below chowns it before this
        # service starts (see that service's comment). The GPU-specific profile
        # downloads here on first boot and is reused after. For air-gapped
        # hosts, pre-seed it from a connected machine -- see
        # ./docs/SYNTHETIC_VIDEO_DETECTOR.md.
        volumes:
          - svd-nim-cache:/opt/nim/.cache
          # Certificate files for the NIM_SSL_* settings above -- uncomment
          # when enabling TLS:
          # - ./certs:/certs:ro
        # gRPC (8001) + HTTP mgmt/health (8000) are reachable on the compose
        # network by default (VIS connects to svd.docker:8001 in-network). To
        # reach the NIM from a VIS on another host, publish the gRPC port --
        # and when the hop crosses an untrusted network, secure it with TLS
        # (NIM_SSL_* above; walkthrough in docs/SYNTHETIC_VIDEO_DETECTOR.md,
        # Deployment topologies):
        # ports:
        #   - "8001:8001"   # gRPC inference
        #   - "8000:8000"   # HTTP metadata / metrics / health
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
          test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health/ready || exit 1"]
          interval: 30s
          timeout: 10s
          retries: 5
          # First boot downloads the GPU-specific model profile; the long
          # grace covers slow links. Later boots reuse the svd-nim-cache volume.
          start_period: 1800s
        deploy:
          resources:
            reservations:
              devices:
                # `video` capability is REQUIRED (the NIM decodes with
                # NVDEC/NVENC), and only this device-reservation form reliably
                # injects the codec libraries. To pin the NIM to a dedicated
                # card on a multi-GPU host, replace `count: all` with e.g.
                # `device_ids: ["1"]` (indices match nvidia-smi).
                - driver: nvidia
                  capabilities: [video, gpu, compute, utility]
                  count: all

    # ── SVD cache-permissions init (one-shot) ─────────────────────────────
    # A fresh Docker volume is created root-owned, but the SVD NIM runs as
    # non-root uid 1000 (triton-server) and its image does NOT pre-create
    # /opt/nim/.cache -- so without this the NIM can't write its model cache
    # ("Permission denied: '/opt/nim/.cache/...'") and never starts. This
    # one-shot chowns the cache volume to the NIM's uid:gid and exits; the
    # `svd` service waits on it (depends_on: service_completed_successfully)
    # and then runs normally as the non-root NIM user. It reuses the NIM image
    # (already pulled -- nothing extra to ship or pre-seed for air-gap) and is
    # the ONLY svd-profile container that runs as root. No GPU needed.
    svd-cache-init:
        image: ${SVD_NIM_IMAGE:-nvcr.io/nim/nvidia/synthetic-video-detector:latest}
        profiles: ["svd"]
        user: "0:0"   # root, just long enough to chown the volume
        entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /opt/nim/.cache"]
        volumes:
          - svd-nim-cache:/opt/nim/.cache
        restart: "no"

# ── Networks ───────────────────────────────────────────────────────────────
networks:
    # VIS <-> managed VLM engines. Internal: no route out, and nothing but VIS
    # and the engines joins it, so Engine, Manager and the other services
    # cannot reach an engine port.
    vif-engines:
        internal: true
    # Outbound access for the engines alone (the HuggingFace weight download).
    # No other service joins it.
    vif-engines-egress: {}

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
    # SVD NIM model-profile cache. Docker-managed named volume; the `svd` and
    # `svd-cache-init` services above explain why it needs the chown one-shot.
    # `name:` pins the real Docker volume name (no compose-project prefix) so
