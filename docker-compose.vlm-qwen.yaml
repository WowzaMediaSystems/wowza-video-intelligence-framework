# Model overlay: run the VLM sidecar with Qwen (the default model), pinned
# explicitly. Alternative to selecting the model with VLM_CONF -- both work;
# use whichever fits your tooling:
#
#   docker compose -f docker-compose.yaml -f docker-compose.vlm-qwen.yaml \
#     --profile default --profile vlm up -d
#
# The model config still comes from ./vlm-env/qwen.env. The !override tag
# REPLACES the base env_file list (instead of compose's default append-merge),
# so no keys from another model file leak through; the overlay also takes
# precedence over VLM_CONF. Requires docker compose v2.24.4+.
services:
    vlm:
        env_file: !override
          - ./vlm-env/qwen.env
